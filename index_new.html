<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<title>Verba Rules</title>
<style>
:root{
  --bg:#09070f;
  --panel:#11101b;
  --panel2:#171426;
  --text:#f7f4ff;
  --muted:#aaa1bd;
  --accent:#9b6cff;
  --accent2:#c09cff;
  --blue:#4f8cff;
  --danger:#ff6f91;
  --line:rgba(178,132,255,.22);
  --shadow:0 14px 40px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 12% -10%,rgba(91,56,190,.38) 0,transparent 34%),
    radial-gradient(circle at 92% 20%,rgba(37,92,190,.16) 0,transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

/* ===== HEADER ===== */
header{
  padding:24px 18px 18px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(9,7,15,.88);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brand{font-size:27px;font-weight:850;letter-spacing:.2px}
.sub{margin-top:4px;color:var(--muted);font-size:13px}
.search{margin-top:16px}
.search input{
  width:100%;
  background:#11131d;
  border:1px solid #34354a;
  border-radius:16px;
  color:var(--text);
  padding:15px 16px;
  font-size:16px;
  outline:none;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,108,255,.10)}

/* ===== MAIN ===== */
main{max-width:980px;margin:auto;padding:18px 18px 100px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{
  background:linear-gradient(145deg,#151522,#10101a);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.btn{
  border:1px solid var(--line);
  background:rgba(24,20,38,.82);
  color:var(--text);
  border-radius:12px;
  padding:10px 13px;
  font-size:13px;
}
.btn:hover{border-color:var(--accent)}
.btn.active{border-color:var(--accent);background:rgba(155,108,255,.13);box-shadow:0 0 0 1px rgba(155,108,255,.08)}

/* ===== TREE ===== */
#tabs{margin:4px 0 18px}
.tree{
  position:relative;
  margin:0 0 10px 4px;
  padding-left:22px;
}
.tree::before{
  content:"";
  position:absolute;
  left:8px;
  top:24px;
  bottom:20px;
  width:2px;
  background:linear-gradient(to bottom,rgba(79,140,255,.45),rgba(155,108,255,.25));
  border-radius:2px;
}
.branch-main{
  position:relative;
  width:100%;
  min-height:64px;
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px 17px;
  background:linear-gradient(145deg,rgba(25,55,95,.96),rgba(55,25,90,.97));
  color:var(--text);
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.16);
  transition:.18s ease;
}
.branch-main:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:var(--shadow)}
.branch-main.active{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(192,156,255,.12),var(--shadow)}
.branch-name{font-weight:800;font-size:15px}
.branch-count{font-size:11px;color:#ddd5ee;margin-top:3px}
.arrow{font-size:24px;color:var(--accent2);transition:transform .18s ease}
.branch-main.active .arrow{transform:rotate(90deg)}

.branch-sections{
  display:none;
  position:relative;
  margin:7px 0 8px 18px;
  padding-left:24px;
}
.branch-sections.open{display:block}
.branch-sections::before{
  content:"";
  position:absolute;
  left:7px;
  top:0;
  bottom:16px;
  width:2px;
  background:rgba(155,108,255,.30);
}
.section-branch{
  position:relative;
  width:100%;
  margin:6px 0;
  padding:12px 14px;
  border:1px solid rgba(178,132,255,.15);
  border-radius:13px;
  background:rgba(21,18,34,.88);
  color:#eee9fa;
  text-align:left;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  transition:.16s ease;
}
.section-branch::before{
  content:"";
  position:absolute;
  left:-18px;
  top:50%;
  width:18px;
  height:2px;
  background:rgba(155,108,255,.30);
}
.section-branch:hover,.section-branch.active{border-color:var(--accent);background:rgba(100,70,170,.18)}
.section-title{font-size:13px;font-weight:700}
.section-count{font-size:11px;color:var(--muted);white-space:nowrap}

/* ===== RULE CARDS ===== */
.rule{
  background:linear-gradient(145deg,rgba(25,55,95,.95),rgba(55,25,90,.96));
  border:1px solid rgba(178,132,255,.20);
  border-radius:18px;
  padding:17px;
  margin:11px 0;
  transition:.16s ease;
}
.rule:hover{transform:translateY(-1px);border-color:rgba(192,156,255,.55);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.rid{color:var(--accent2);font-size:12px;font-weight:850;margin-bottom:7px}
.rtitle{color:#f3f0ff;font-size:14px;line-height:1.55}
.pun{
  display:inline-block;
  margin-top:10px;
  color:#ff9aaa;
  background:rgba(255,102,125,.10);
  border:1px solid rgba(255,102,125,.24);
  border-radius:9px;
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
}
.empty{padding:42px 12px;text-align:center;color:var(--muted);line-height:1.6}

/* ===== DETAIL ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.70);z-index:30;display:none;align-items:flex-end}
.overlay.show{display:flex}
.sheet{
  width:100%;
  max-height:90vh;
  overflow:auto;
  background:#11131d;
  border-top:1px solid #34354a;
  border-radius:24px 24px 0 0;
  padding:20px 18px 30px;
}
@media(min-width:700px){.overlay{align-items:center}.sheet{max-width:800px;border-radius:24px}}
.close{float:right;border:0;background:#272b3a;color:#fff;width:36px;height:36px;border-radius:50%;font-size:19px}
.detail h2{margin:6px 48px 6px 0;font-size:22px}
.detail .section{color:var(--muted);font-size:12px}
.block{margin-top:18px}
.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}
.value{font-size:15px;line-height:1.65;white-space:pre-wrap}
.punbig{color:#ff9aaa;font-weight:850;line-height:1.5}
.note{background:#191a2b;border:1px solid #34324c;padding:13px;border-radius:13px;color:#e3def5;line-height:1.55;white-space:pre-wrap}

/* ===== ANALYSIS ===== */
.analysis{display:none}
.analysis.show{display:block}
.analysis textarea{
  width:100%;
  min-height:140px;
  background:#11131d;
  border:1px solid #34354a;
  border-radius:15px;
  color:#fff;
  padding:14px;
  outline:none;
  resize:vertical;
}
.analysis textarea:focus{border-color:var(--accent)}
.small{font-size:12px;color:var(--muted);line-height:1.5}

/* ===== FAB ===== */
.fab{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:15;
  background:var(--accent);
  border:0;
  color:white;
  border-radius:17px;
  padding:13px 15px;
  font-weight:850;
  box-shadow:0 10px 35px rgba(124,92,255,.35);
}

/* ===== LOADING / ERROR ===== */
.status{padding:24px 8px;color:var(--muted);text-align:center}
.status.error{color:#ff9aaa}

@media(max-width:600px){
  header{padding:20px 14px 15px}
  main{padding:14px 14px 90px}
  .branch-main{min-height:60px;padding:14px;border-radius:15px}
  .branch-name{font-size:14px}
  .section-branch{padding:11px 12px}
  .rule{padding:15px}
}
</style>
</head>
<body>

<header>
  <div class="brand">⚖️ Verba Rules</div>
  <div class="sub">Довідник правил для кураторів та адміністраторів</div>
  <div class="search">
    <input id="search" type="search" autocomplete="off" placeholder="Пошук: 5.14, NonRP, DM, майно...">
  </div>
</header>

<main>
  <div class="stats">
    <div class="stat"><b id="count">0</b><span>знайдено правил</span></div>
    <div class="stat"><b id="sectionCount">0</b><span>підрозділів</span></div>
  </div>

  <div class="tools">
    <button class="btn active" id="allBtn">Усі</button>
    <button class="btn" id="punBtn">З покаранням</button>
    <button class="btn" id="analysisBtn">Розбір ситуації</button>
  </div>

  <div id="tabs"></div>

  <section id="list"></section>

  <section class="analysis" id="analysis">
    <h2>Розбір ситуації</h2>
    <button class="btn" id="backToRules">← До правил</button>
    <p class="small">
      Опиши ситуацію. Застосунок підбере найбільш схожі правила за ключовими словами.
      Це довідкова підказка — остаточне рішення приймається за фактичними обставинами.
    </p>
    <textarea id="situation" placeholder="Наприклад: гравець під час переслідування вийшов із гри..."></textarea>
    <div class="tools">
      <button class="btn active" id="analyze">Знайти правила</button>
    </div>
    <div id="result"></div>
  </section>
</main>

<button class="fab" id="top">↑ На початок</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close" id="close">×</button>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
'use strict';

let RULES = [];
let activeCategory = '';
let activeSection = 'Усі правила';
let punishmentOnly = false;
let openCategory = '';

const CATEGORIES = [
  'Основні правила',
  'Правила сімей',
  'Правила війни за бізнес',
  'Правила військового складу',
  'Правила лідерів та заступників'
];

const aliases = {
  dm:['death match','вбив','убив','стріляв','шкоди'],
  'mass dm':['масов','3+','троє'],
  mg:['metagaming','метагейм','адмін','discord','пінг','краш','залаг'],
  nonrp:['нерп','nonrp','нелогіч','реальн','логік'],
  pg:['powergaming','надлюд','самозбереж'],
  afk:['афк','afk','відійшов'],
  ramming:['таран','підріз','зіткнен'],
  bug:['баг','bug','помилка'],
  майно:['будинок','квартира','бізнес','нерухом'],
  гроші:['кошти','валюта','переказ','гроші','продаж'],
  образ:['образ','приниж','батьк','родич'],
  реклама:['реклам','сервер','сайт','канал'],
  новач:['новач','рівень','level','6 рів'],
  report:['report','репорт','адмін'],
  скарга:['скарг','апеляц','discord'],
  капс:['capslock','капслок','верхній регістр'],
  флуд:['флуд','повторюван','повідомл']
};

const $ = id => document.getElementById(id);

function norm(value){
  return String(value || '')
    .toLowerCase()
    .replaceAll('’', "'")
    .replace(/[^a-zа-яіїєґ0-9.+-]/gi, ' ')
    .replace(/\s+/g,' ')
    .trim();
}

function escapeHtml(value){
  return String(value || '').replace(/[&<>"']/g, char => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[char]);
}

function searchable(rule){
  return norm([
    rule.id,
    rule.text,
    rule.punishment,
    rule.notes,
    rule.examples,
    rule.section,
    rule.category
  ].join(' '));
}

function categoryRules(category){
  return RULES.filter(rule => rule.category === category);
}

function sectionRules(category, section){
  return RULES.filter(rule =>
    rule.category === category &&
    (section === 'Усі правила' || rule.section === section)
  );
}

function getSections(category){
  return [...new Set(
    categoryRules(category)
      .map(rule => rule.section)
      .filter(Boolean)
  )];
}

function buildCategoryMenu(){
  const tabs = $('tabs');
  tabs.innerHTML = '';

  const totalSections = new Set(RULES.map(rule => rule.section).filter(Boolean)).size;
  $('sectionCount').textContent = totalSections;

  CATEGORIES.forEach(category => {
    const tree = document.createElement('div');
    tree.className = 'tree';

    const mainButton = document.createElement('button');
    mainButton.className = 'branch-main';
    mainButton.type = 'button';

    const count = categoryRules(category).length;
    const sectionCount = getSections(category).length;

    mainButton.innerHTML = `
      <span>
        <span class="branch-name">🌿 ${escapeHtml(category)}</span>
        <span class="branch-count">${count} правил · ${sectionCount} підрозділів</span>
      </span>
      <span class="arrow">›</span>
    `;

    const sectionsBox = document.createElement('div');
    sectionsBox.className = 'branch-sections';

    const allButton = document.createElement('button');
    allButton.className = 'section-branch';
    allButton.type = 'button';
    allButton.innerHTML = `
      <span class="section-title">📚 Усі правила</span>
      <span class="section-count">${count}</span>
    `;

    allButton.onclick = () => {
      activeCategory = category;
      activeSection = 'Усі правила';
      document.querySelectorAll('.section-branch').forEach(el => el.classList.remove('active'));
      allButton.classList.add('active');
      render();
    };

    sectionsBox.appendChild(allButton);

    getSections(category).forEach(section => {
      const sectionButton = document.createElement('button');
      sectionButton.className = 'section-branch';
      sectionButton.type = 'button';

      const sectionCount = sectionRules(category, section).length;
      sectionButton.innerHTML = `
        <span class="section-title">🪻 ${escapeHtml(section)}</span>
        <span class="section-count">${sectionCount}</span>
      `;

      sectionButton.onclick = () => {
        activeCategory = category;
        activeSection = section;
        document.querySelectorAll('.section-branch').forEach(el => el.classList.remove('active'));
        sectionButton.classList.add('active');
        render();
      };

      sectionsBox.appendChild(sectionButton);
    });

    mainButton.onclick = () => {
      const shouldOpen = openCategory !== category;
      openCategory = shouldOpen ? category : '';

      document.querySelectorAll('.branch-main').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.branch-sections').forEach(el => el.classList.remove('open'));

      if(shouldOpen){
        activeCategory = category;
        activeSection = 'Усі правила';
        mainButton.classList.add('active');
        sectionsBox.classList.add('open');
        allButton.classList.add('active');
        render();
      }
    };

    tree.appendChild(mainButton);
    tree.appendChild(sectionsBox);
    tabs.appendChild(tree);
  });
}

function getFilteredRules(){
  const query = norm($('search').value);

  let list = RULES.filter(rule =>
    (!activeCategory || rule.category === activeCategory) &&
    (activeSection === 'Усі правила' || rule.section === activeSection) &&
    (!punishmentOnly || Boolean(rule.punishment))
  );

  if(query){
    const words = query.split(/\s+/).filter(Boolean);
    list = list.filter(rule => {
      const text = searchable(rule);
      return words.every(word => text.includes(word));
    });
  }

  return list;
}

function render(){
  const list = $('list');
  const out = getFilteredRules();
  $('count').textContent = out.length;

  if(!activeCategory){
    list.innerHTML = `
      <div class="empty">
        🌿 Обери основний розділ вище, щоб відкрити його гілки та правила.
      </div>
    `;
    return;
  }

  if(!out.length){
    list.innerHTML = `
      <div class="empty">
        Нічого не знайдено.<br>
        Спробуй номер правила або інше ключове слово.
      </div>
    `;
    return;
  }

  list.innerHTML = out.map(rule => `
    <article class="rule" data-rule-id="${escapeHtml(rule.id)}">
      <div class="rid">${escapeHtml(rule.id)}</div>
      <div class="rtitle">${escapeHtml(rule.text.slice(0,150))}${rule.text.length > 150 ? '…' : ''}</div>
      ${rule.punishment ? `<span class="pun">⚠ ${escapeHtml(rule.punishment)}</span>` : ''}
    </article>
  `).join('');

  list.querySelectorAll('.rule').forEach(card => {
    card.onclick = () => {
      const rule = RULES.find(item => item.id === card.dataset.ruleId && item.category === activeCategory);
      if(rule) openRule(rule);
    };
  });
}

function openRule(rule){
  let html = `
    <div class="section">${escapeHtml(rule.category)} · ${escapeHtml(rule.section)}</div>
    <h2>${escapeHtml(rule.id)}</h2>
    <div class="block">
      <div class="label">Правило</div>
      <div class="value">${escapeHtml(rule.text)}</div>
    </div>
  `;

  if(rule.punishment){
    html += `
      <div class="block">
        <div class="label">Покарання</div>
        <div class="value punbig">${escapeHtml(rule.punishment)}</div>
      </div>
    `;
  }

  if(rule.notes){
    html += `
      <div class="block">
        <div class="label">Примітка / виняток</div>
        <div class="note">${escapeHtml(rule.notes)}</div>
      </div>
    `;
  }

  if(rule.examples){
    html += `
      <div class="block">
        <div class="label">Приклад</div>
        <div class="value">${escapeHtml(rule.examples)}</div>
      </div>
    `;
  }

  html += `
    <div class="tools" style="margin-top:20px">
      <button class="btn" id="copyRule">📋 Скопіювати правило</button>
    </div>
  `;

  $('detail').innerHTML = html;
  $('overlay').classList.add('show');

  $('copyRule').onclick = async () => {
    const text = [
      `${rule.id} — ${rule.text}`,
      rule.punishment ? `Покарання: ${rule.punishment}` : '',
      rule.notes ? `Примітка: ${rule.notes}` : '',
      rule.examples ? `Приклад: ${rule.examples}` : ''
    ].filter(Boolean).join('\n');

    try{
      await navigator.clipboard.writeText(text);
      $('copyRule').textContent = '✓ Скопійовано';
    }catch(e){
      $('copyRule').textContent = 'Не вдалося скопіювати';
    }
  };
}

function showRules(){
  $('analysis').classList.remove('show');
  $('list').style.display = '';
  $('tabs').style.display = '';
  $('analysisBtn').classList.remove('active');
  $('top').style.display = '';
}

function showAnalysis(){
  $('list').style.display = 'none';
  $('tabs').style.display = 'none';
  $('analysis').classList.add('show');
  $('analysisBtn').classList.add('active');
  $('top').style.display = 'none';
}

function analyzeSituation(){
  const query = norm($('situation').value);

  if(!query){
    $('result').innerHTML = '<div class="empty">Опиши ситуацію.</div>';
    return;
  }

  const terms = query.split(/\s+/).filter(word => word.length > 2);

  const scored = RULES.map(rule => {
    let score = 0;
    const text = searchable(rule);

    terms.forEach(term => {
      if(text.includes(term)) score += 2;
    });

    Object.values(aliases).forEach(words => {
      const queryHasAlias = words.some(word => query.includes(norm(word)));
      const ruleHasAlias = words.some(word => text.includes(norm(word)));
      if(queryHasAlias && ruleHasAlias) score += 3;
    });

    return {score, rule};
  })
  .filter(item => item.score > 0)
  .sort((a,b) => b.score - a.score)
  .slice(0,8);

  if(!scored.length){
    $('result').innerHTML = '<div class="empty">Не знайшов достатньо схожих правил.</div>';
    return;
  }

  $('result').innerHTML = scored.map(item => `
    <article class="rule analysis-rule" data-id="${escapeHtml(item.rule.id)}" data-category="${escapeHtml(item.rule.category)}">
      <div class="rid">${escapeHtml(item.rule.id)}</div>
      <div class="rtitle">${escapeHtml(item.rule.text.slice(0,150))}${item.rule.text.length > 150 ? '…' : ''}</div>
      ${item.rule.punishment ? `<span class="pun">⚠ ${escapeHtml(item.rule.punishment)}</span>` : ''}
    </article>
  `).join('');

  $('result').querySelectorAll('.analysis-rule').forEach(card => {
    card.onclick = () => {
      const rule = RULES.find(item => item.id === card.dataset.id && item.category === card.dataset.category);
      if(rule) openRule(rule);
    };
  });
}

$('search').addEventListener('input', render);

$('allBtn').onclick = () => {
  punishmentOnly = false;
  $('allBtn').classList.add('active');
  $('punBtn').classList.remove('active');
  render();
};

$('punBtn').onclick = () => {
  punishmentOnly = true;
  $('punBtn').classList.add('active');
  $('allBtn').classList.remove('active');
  render();
};

$('analysisBtn').onclick = showAnalysis;
$('backToRules').onclick = () => {
  $('result').innerHTML = '';
  $('situation').value = '';
  showRules();
  render();
};
$('analyze').onclick = analyzeSituation;
$('top').onclick = () => window.scrollTo({top:0,behavior:'smooth'});
$('close').onclick = () => $('overlay').classList.remove('show');
$('overlay').onclick = event => {
  if(event.target === $('overlay')) $('overlay').classList.remove('show');
};

document.addEventListener('keydown', event => {
  if(event.key === 'Escape') $('overlay').classList.remove('show');
});

async function loadRules(){
    try{
        let response;

        try{
            response = await fetch('rules.json', {cache:'no-store'});
        }catch(e){
            response = await fetch(
                'https://raw.githubusercontent.com/mashaturta-sudo/verba-rules/main/rules.json',
                {cache:'no-store'}
            );
        }

        if(!response.ok){
            throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        if(!Array.isArray(data)){
            throw new Error('rules.json має неправильний формат');
        }

        RULES = data;

        buildCategoryMenu();
        render();

    }catch(error){
        console.error(error);

        $('#count').textContent = '0';
        $('#sectionCount').textContent = '—';
        $('#tabs').innerHTML = '';
        $('#list').innerHTML = `
            <div class="status error">
                <strong>Не вдалося завантажити rules.json</strong><br>
                Перевір, що файл rules.json знаходиться в репозиторії.
            </div>
        `;
    }
}

loadRules();
</script>
