<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Verba Rules</title>
<style>
:root{--bg:#0b0e13;--card:#141923;--card2:#1a202c;--text:#f4f6fa;--muted:#9da7b8;--accent:#7c5cff;--accent2:#9a83ff;--danger:#ff667d;--ok:#42d392;--line:#252c39}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#251b52 0,#0b0e13 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{padding:22px 18px 14px;position:sticky;top:0;z-index:5;background:rgba(11,14,19,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-size:25px;font-weight:800;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.search{margin-top:15px;display:flex;gap:8px}.search input{width:100%;background:#111620;border:1px solid #303747;border-radius:14px;color:var(--text);padding:14px 15px;font-size:16px;outline:none}.search input:focus{border-color:var(--accent)}
.search input:focus{
  border-color:var(--accent)
}

/* ===== ГЛАВНОЕ МЕНЮ ===== */

.category-main{
  width:100%;
  min-height:72px;
  margin:8px 0;
  padding:18px 22px;

  background:linear-gradient(145deg,#151b26,#11151d);
  border:1px solid var(--line);
  border-radius:16px;

  color:var(--text);
  font-size:16px;
  font-weight:700;
  text-align:left;

  cursor:pointer;
  transition:
    transform .15s ease,
    border-color .15s ease,
    background .15s ease,
    box-shadow .15s ease;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.category-main::after{
  content:"›";
  font-size:28px;
  color:var(--accent);
  transition:transform .15s ease;
}

.category-main:hover{
  border-color:var(--accent);
  background:linear-gradient(145deg,#1b2030,#151927);
  transform:translateY(-1px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.category-main:hover::after{
  transform:translateX(4px);
}

.category-main:active{
  transform:scale(.99);
}

.category-main.active{
  border-color:var(--accent);
  background:linear-gradient(
    145deg,
    rgba(124,92,255,.20),
    rgba(124,92,255,.08)
  );
  box-shadow:0 0 0 1px rgba(124,92,255,.15);
}

#tabs{
  margin-top:14px;
}

@media (max-width:600px){
  .category-main{
    min-height:64px;
    padding:16px 18px;
    font-size:15px;
    border-radius:14px;
  }

  .category-main::after{
    font-size:24px;
  }
}

.tabs{
  position:relative;
  padding:10px 18px 4px;
}
.tabs{
  position:relative;
  padding:10px 18px 4px;
}

.category-toggle{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:13px 15px;
  border-radius:14px;
  font-size:14px;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.category-toggle.active{
  border-color:var(--accent);
  background:rgba(124,92,255,.12);
}

.category-menu{
  display:none;
  margin-top:8px;
  background:#141923;
  border:1px solid var(--line);
  border-radius:14px;
  padding:6px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.category-menu.show{
  display:block;
}

.tab{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px 12px;
  border-radius:10px;
  font-size:13px;
  text-align:left;
}

.tab.active{
  background:var(--accent);
  color:#fff;
}
main{padding:10px 18px 90px;max-width:900px;margin:auto}.tools{display:flex;gap:8px;margin:10px 0 14px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px}.btn.active{border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.stat{background:linear-gradient(145deg,#171d28,#11151d);border:1px solid var(--line);border-radius:14px;padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}
.rule{background:linear-gradient(145deg,#151b26,#11151d);border:1px solid var(--line);border-radius:16px;padding:15px;margin:9px 0;cursor:pointer}.rule:active{transform:scale(.995)}.rid{color:#a992ff;font-weight:800;font-size:14px}.rtitle{font-weight:700;margin:4px 0 7px;font-size:15px}.rtext{color:#d6dbe4;font-size:13px;line-height:1.45}.pun{display:inline-block;margin-top:9px;background:rgba(255,102,125,.1);border:1px solid rgba(255,102,125,.25);color:#ff9aaa;border-radius:9px;padding:5px 8px;font-size:11px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}.fab{position:fixed;right:18px;bottom:20px;background:var(--accent);border:0;color:white;border-radius:18px;padding:14px 16px;font-weight:800;box-shadow:0 10px 35px rgba(124,92,255,.35)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:20;display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#11161f;border-top:1px solid #303747;border-radius:22px 22px 0 0;padding:20px 18px 30px}.close{float:right;border:0;background:#252c39;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px}.detail h2{margin:5px 45px 5px 0}.detail .section{color:var(--muted);font-size:12px}.block{margin-top:17px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.value{font-size:15px;line-height:1.55}.punbig{color:#ff9aaa;font-weight:800}.note{background:#191b2b;border:1px solid #34324c;padding:12px;border-radius:12px;color:#ddd8ff}
.analysis{display:none}.analysis.show{display:block}.analysis textarea{width:100%;min-height:130px;background:#111620;border:1px solid #303747;border-radius:14px;color:#fff;padding:13px;font:inherit;resize:vertical}.result{margin-top:12px}
.small{font-size:12px;color:var(--muted);line-height:1.4}
@media(min-width:700px){.overlay{align-items:center}.sheet{max-width:760px;border-radius:22px}.rule{padding:17px}}
</style>
</head>
<body>
<header>
  <div class="brand">⚖️ Verba Rules</div>
  <div class="sub">Довідник правил для кураторів та адміністраторів</div>
  <div class="search"><input id="search" placeholder="Пошук: 5.14, NonRP, DM, майно..."></div>
</header>
<div class="tabs" id="tabs"></div>
<main>
  <div class="stats">
    <div class="stat"><b id="count">0</b><span>знайдено правил</span></div>
    <div class="stat"><b id="sectionCount">8</b><span>розділів</span></div>
  </div>
  <div class="tools">
    <button class="btn active" id="allBtn">Усі</button>
    <button class="btn" id="punBtn">З покаранням</button>
    <button class="btn" id="analysisBtn">Розбір ситуації</button>
  </div>
  <section id="list"></section>
  <section class="analysis" id="analysis">
    <h2>Розбір ситуації</h2>
    <button class="btn" id="backToRules">← До всіх правил</button>
    <p class="small">Опиши, що сталося. Застосунок підбере найбільш схожі правила за ключовими словами. Це довідкова підказка — остаточне рішення приймається за фактичними обставинами.</p>
    <textarea id="situation" placeholder="Наприклад: гравець під час переслідування вийшов із гри..."></textarea>
    <div class="tools"><button class="btn active" id="analyze">Знайти правила</button></div>
    <div class="result" id="result"></div>
  </section>
</main>
<button class="fab" id="top">↑ На початок</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close" id="close">×</button>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
let RULES = [];

fetch('rules.json')
  .then(response => {
    if (!response.ok) {
      throw new Error('Не вдалося завантажити rules.json');
    }
    return response.json();
  })
  .then(data => {
    RULES = data;
    buildCategoryMenu();
    render();
  })
  .catch(error => {
    console.error(error);
    document.getElementById('list').innerHTML =
      '<div class="empty">Не вдалося завантажити правила.</div>';
  });
  
const aliases = {
  "dm":["death match","вбив","убив","стріляв","шкоди"],
  "mass dm":["масов","3+","троє"],
  "mg":["metagaming","метагейм","адмін","discord","пінг","краш","залаг"],
  "nonrp":["нерп","nonrp","нелогіч","реальн","логік"],
  "pg":["powergaming","надлюд","самозбереж"],
  "afk":["афк","afk","відійшов"],
  "ramming":["таран","підріз","зіткнен"],
  "bug":["баг","bug","помилка"],
  "майно":["будинок","квартира","бізнес","нерухом"],
  "гроші":["кошти","валюта","переказ","гроші","продаж"],
  "образ":["образ","приниж","батьк","родич"],
  "реклама":["реклам","сервер","сайт","канал"],
  "новач":["новач","рівень","level","6 рів"],
  "report":["report","репорт","адмін"],
  "скарга":["скарг","апеляц","discord"],
  "капс":["capslock","капслок","верхній регістр"],
  "флуд":["флуд","повторюван","повідомл"]
};
let activeSection="Усі правила";
let activeCategory="Основні правила";
let punishmentOnly=false;

const tabs=document.getElementById('tabs');

function buildCategoryMenu(){
  tabs.innerHTML = '';

  const categories = [
    'Основні правила',
    'Правила сімей',
    'Правила війни за бізнес',
    'Правила військового складу',
    'Правила лідерів та заступників'
  ];

  categories.forEach(category => {
    const button = document.createElement('button');

    button.className = 'category-main';
    button.textContent = category;

    button.onclick = () => {
      activeCategory = category;
      activeSection = 'Усі правила';
      
      document
        .querySelectorAll('.category-main')
        .forEach(x => x.classList.remove('active'));

      button.classList.add('active');

      render();
    };

    tabs.appendChild(button);
  });
}

function norm(s){return s.toLowerCase().replaceAll('’',"'").replace(/[^a-zа-яіїєґ0-9.+-]/gi,' ')}
function searchable(r){return norm([r.id,r.text,r.punishment,r.notes,r.examples,r.section].join(' '))}
function render(){
  const q=norm(document.getElementById('search').value);
  const arr=RULES.filter(r=>
  (activeCategory==="Усі правила" || r.category===activeCategory) &&
  (activeSection==="Усі правила" || r.section===activeSection) &&
  (punishmentOnly || r.punishment)
);
  const out=q?arr.filter(r=>searchable(r).includes(q)||q.split(/\s+/).filter(Boolean).every(w=>searchable(r).includes(w))):arr;
  document.getElementById('count').textContent=out.length;
  const list=document.getElementById('list');
  list.innerHTML='';
  if(!out.length){list.innerHTML='<div class="empty">Нічого не знайдено.<br>Спробуй номер правила або інше ключове слово.</div>';return}
  out.forEach(r=>{
    const el=document.createElement('article');el.className='rule';
    el.innerHTML=`<div class="rid">${r.id}</div><div class="rtitle">${escapeHtml(r.text.slice(0,120))}${r.text.length>120?'…':''}</div>${r.punishment?`<span class="pun">⚠ ${escapeHtml(r.punishment)}</span>`:''}`;
    el.onclick=()=>openRule(r);list.appendChild(el);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openRule(r){
  let h=`<div class="section">${escapeHtml(r.section)}</div><h2>${escapeHtml(r.id)}</h2><div class="block"><div class="label">Правило</div><div class="value">${escapeHtml(r.text)}</div></div>`;
  if(r.punishment)h+=`<div class="block"><div class="label">Покарання</div><div class="value punbig">${escapeHtml(r.punishment)}</div></div>`;
  if(r.notes)h+=`<div class="block"><div class="label">Примітка / виняток</div><div class="note">${escapeHtml(r.notes)}</div></div>`;
  if(r.examples)h+=`<div class="block"><div class="label">Приклад</div><div class="value">${escapeHtml(r.examples)}</div></div>`;
  h+=`<div class="tools" style="margin-top:20px"><button class="btn" onclick="copyRule('${r.id}')">📋 Скопіювати</button></div>`;
  document.getElementById('detail').innerHTML=h;document.getElementById('overlay').classList.add('show');
}
function copyRule(id){const r=RULES.find(x=>x.id===id);const t=`${r.id} — ${r.text}${r.punishment?`\nПокарання: ${r.punishment}`:''}${r.notes?`\nПримітка: ${r.notes}`:''}${r.examples?`\nПриклад: ${r.examples}`:''}`;navigator.clipboard?.writeText(t)}
document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.currentTarget.classList.remove('show')};
document.getElementById('search').oninput=render;
document.getElementById('punBtn').onclick=()=>{punishmentOnly=!punishmentOnly;document.getElementById('punBtn').classList.toggle('active',punishmentOnly);document.getElementById('allBtn').classList.toggle('active',!punishmentOnly); render()};
document.getElementById('allBtn').onclick=()=>{punishmentOnly=false;document.getElementById('punBtn').classList.remove('active');document.getElementById('allBtn').classList.add('active'); render()};
document.getElementById('analysisBtn').onclick=()=>{
  document.getElementById('list').style.display='none';
  document.getElementById('analysis').classList.add('show');
  document.getElementById('analysisBtn').classList.add('active');
  document.getElementById('top').style.display='none';
};

document.getElementById('backToRules').onclick=()=>{
  document.getElementById('analysis').classList.remove('show');
  document.getElementById('list').style.display='';
  document.getElementById('analysisBtn').classList.remove('active');
  document.getElementById('top').style.display='';
  document.getElementById('result').innerHTML='';
  document.getElementById('situation').value='';
  render();
};
document.getElementById('analyze').onclick=()=>{
  const q=norm(document.getElementById('situation').value);
  if(!q){document.getElementById('result').innerHTML='<div class="empty">Опиши ситуацію.</div>';return}
  const terms=q.split(/\s+/).filter(Boolean);
  const scored=RULES.map(r=>{let s=0,t=searchable(r);terms.forEach(x=>{if(x.length>2&&t.includes(x))s+=2});Object.values(aliases).forEach(a=>{if(a.some(x=>q.includes(norm(x)))){if(a.some(x=>t.includes(norm(x))))s+=3}});return [s,r]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,8);
  document.getElementById('result').innerHTML=scored.length?scored.map(x=>`<article class="rule" onclick='openRule(${JSON.stringify(x[1])})'><div class="rid">${escapeHtml(x[1].id)}</div><div class="rtitle">${escapeHtml(x[1].text.slice(0,150))}${x[1].text.length>150?'…':''}</div>${x[1].punishment?`<span class="pun">⚠ ${escapeHtml(x[1].punishment)}</span>`:''}</article>`).join(''):'<div class="empty">Не знайшов достатньо схожих правил.</div>';
};
document.getElementById('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
render();
</script>
</body>
</html>
