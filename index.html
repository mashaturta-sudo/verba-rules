<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0759ff">
<title>Verba Rules</title>
<style>
:root{
  --blue:#0759ff;
  --blue2:#168bff;
  --cyan:#65d8ff;
  --soft:#b9efff;
  --text:#f7fbff;
  --muted:#d8edff;
  --glass:rgba(4,35,110,.58);
  --glass2:rgba(7,50,145,.66);
  --border:rgba(170,235,255,.55);
  --shadow:0 12px 36px rgba(0,35,130,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#0038e8 0%,#0759ff 25%,#168bff 55%,#65d8ff 82%,#c9f4ff 100%);
  background-repeat:no-repeat;
  background-size:100% 100%;
  background-attachment:scroll;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.18),transparent 38%);
}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:22px 0 70px}
.header{display:flex;align-items:center;gap:20px;padding:10px 4px 22px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.5);box-shadow:0 0 28px rgba(130,230,255,.35);font-size:29px}
.brand h1{margin:0;font-size:clamp(24px,4vw,42px);letter-spacing:.5px;line-height:1}
.brand p{margin:7px 0 0;color:#e2f6ff;font-size:14px}
.header-actions{margin-left:auto;display:flex;gap:9px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:20px;backdrop-filter:blur(12px)}
.search-wrap{position:relative;margin:4px 0 17px}
.search{width:100%;height:58px;padding:0 20px 0 58px;border-radius:30px;border:1px solid rgba(175,240,255,.9);outline:none;background:rgba(4,34,122,.62);color:#fff;box-shadow:0 0 28px rgba(75,210,255,.2),inset 0 0 25px rgba(0,120,255,.15);backdrop-filter:blur(12px)}
.search::placeholder{color:#d7edff}
.search:focus{box-shadow:0 0 0 3px rgba(150,240,255,.18),0 0 32px rgba(90,220,255,.35)}
.search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:24px}
.tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid rgba(150,235,255,.52);border-radius:22px;padding:10px 16px;color:#fff;background:rgba(7,42,133,.55);backdrop-filter:blur(10px);transition:.2s}
.tab.active{background:linear-gradient(135deg,#70e2ff,#168bff);color:#06245d;border-color:#c5f5ff;box-shadow:0 0 22px rgba(110,225,255,.42);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 20px}
.stat{min-height:82px;padding:14px 18px;border:1px solid rgba(174,239,255,.46);border-radius:18px;background:rgba(5,42,133,.44);backdrop-filter:blur(14px);box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}
.stat-icon{font-size:27px}.stat small{display:block;color:#d6efff;font-size:12px}.stat strong{font-size:23px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px}
.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:#d8efff}
.branch{border:1px solid rgba(176,239,255,.68);border-radius:19px;background:linear-gradient(145deg,rgba(8,53,157,.82),rgba(9,73,165,.64));box-shadow:0 10px 28px rgba(0,39,135,.24);margin:10px 0;overflow:hidden;backdrop-filter:blur(12px)}
.branch-head{width:100%;border:0;background:transparent;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:15px;text-align:left}
.num{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(80,200,255,.12));border:1px solid rgba(190,242,255,.75);font-size:19px;font-weight:900;flex:0 0 auto}
.branch-name{flex:1;min-width:0}.branch-name b{display:block;font-size:17px}.category-prefix{display:inline-block;margin-right:7px;padding:3px 7px;border:1px solid rgba(190,242,255,.62);border-radius:8px;background:rgba(105,220,255,.14);color:#aef1ff;font-size:12px;line-height:1;vertical-align:2px;letter-spacing:.3px}.branch-name small{display:block;color:#cfeeff;margin-top:3px}.chev{font-size:24px;transition:.2s}.branch.open .chev{transform:rotate(180deg)}
.branch-body{display:none;padding:0 14px 14px}.branch.open .branch-body{display:block}
.subbranch{border:1px solid rgba(178,237,255,.42);border-radius:15px;margin:8px 0;overflow:hidden;background:rgba(3,42,115,.34)}
.sub-head{width:100%;border:0;background:transparent;color:#fff;padding:13px 14px;display:flex;align-items:center;gap:10px;text-align:left}.sub-head b{flex:1}.sub-head span{font-size:12px;color:#d9efff}.sub-body{display:none;padding:0 10px 10px}.subbranch.open .sub-body{display:block}
.rule{border:1px solid rgba(164,231,255,.5);border-radius:14px;margin:7px 0;padding:13px 14px;background:linear-gradient(145deg,rgba(17,75,180,.94),rgba(66,31,143,.94));box-shadow:0 7px 20px rgba(0,30,110,.22);transition:.18s}
.quick-tools{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}.tool-btn{border:1px solid rgba(190,242,255,.62);background:rgba(4,40,125,.5);color:#fff;border-radius:13px;padding:10px 15px;font-weight:800;cursor:pointer;box-shadow:0 0 18px rgba(60,200,255,.12);transition:.16s}.tool-btn:hover{transform:translateY(-1px);border-color:#d8faff;background:linear-gradient(135deg,rgba(46,150,255,.8),rgba(100,70,210,.8))}.tool-btn.active{background:linear-gradient(135deg,#38c9ff,#176dff);color:#fff;border-color:#d9fbff;box-shadow:0 0 22px rgba(50,210,255,.3)}
.category-view{display:none}
.category-view.show{display:block}
.category-toolbar{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.back-btn{border:1px solid rgba(190,242,255,.72);background:rgba(4,40,125,.62);color:#fff;border-radius:14px;padding:11px 16px;font-weight:800;box-shadow:0 0 20px rgba(80,215,255,.18);backdrop-filter:blur(12px)}
.back-btn:hover{background:linear-gradient(135deg,#68dcff,#168bff);color:#05265e}
.category-heading{flex:1;min-width:0;border:1px solid rgba(180,239,255,.52);border-radius:17px;padding:12px 16px;background:rgba(4,39,122,.46);backdrop-filter:blur(12px)}
.category-heading b{display:block;font-size:20px}.category-heading small{display:block;color:#d9efff;margin-top:3px}
.strip-section{margin:16px 0 10px}.strip-section-title{display:flex;align-items:center;gap:10px;margin:0 4px 8px;color:#e9f9ff;font-size:15px;font-weight:900}.strip-section-title span{font-size:11px;color:#bfeaff;font-weight:600}
.rule-strip{display:flex;align-items:center;gap:12px;width:100%;margin:7px 0;padding:12px 14px;border:1px solid rgba(177,238,255,.56);border-radius:13px;background:linear-gradient(90deg,rgba(8,55,158,.86),rgba(28,104,195,.64));box-shadow:0 6px 18px rgba(0,35,120,.2);color:#fff;text-align:left;transition:.16s;cursor:pointer}
.rule-strip:hover{transform:translateX(3px);border-color:rgba(220,250,255,.95);box-shadow:0 8px 24px rgba(35,170,255,.25)}
.strip-id{flex:0 0 auto;min-width:48px;color:#aef1ff;font-weight:900;font-size:14px}.strip-text{flex:1;font-size:13px;line-height:1.4}.strip-pun{flex:0 0 auto;font-size:10px;color:#e0f8ff;border:1px solid rgba(180,240,255,.3);padding:4px 7px;border-radius:8px;background:rgba(0,28,100,.25);max-width:230px}
.home-only{display:block}.category-mode .home-only{display:none}.category-mode .category-view{display:block}
.category-mode #quickTools{display:none!important}.category-mode #analysisView{display:none!important}
@media(max-width:700px){.category-toolbar{align-items:stretch}.back-btn{padding:10px 12px}.category-heading{padding:10px 12px}.category-heading b{font-size:16px}.strip-pun{display:none}.rule-strip{padding:11px 10px}.strip-text{font-size:12px}}

.rule:hover{transform:translateY(-1px);border-color:rgba(205,247,255,.9)}
.rule-top{display:flex;gap:9px;align-items:center;margin-bottom:6px}.rid{font-weight:900;color:#a9f0ff}.pun{margin-left:auto;color:#dff8ff;font-size:11px;border:1px solid rgba(180,240,255,.35);padding:4px 7px;border-radius:8px;background:rgba(0,30,100,.22)}
.rtext{font-size:14px;line-height:1.55;color:#f7fbff}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{font-size:11px;padding:4px 7px;border-radius:8px;background:rgba(255,255,255,.1);color:#dff7ff}
.empty{padding:38px 18px;text-align:center;border:1px dashed rgba(210,247,255,.55);border-radius:18px;background:rgba(3,48,126,.32);color:#e5f7ff}
.modal{position:fixed;inset:0;background:rgba(0,18,70,.68);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20;backdrop-filter:blur(8px)}
.modal.show{display:flex}.modal-card{width:min(820px,100%);max-height:88vh;overflow:auto;border:1px solid rgba(190,241,255,.72);border-radius:24px;background:linear-gradient(160deg,rgba(5,48,140,.98),rgba(61,26,125,.98));box-shadow:0 20px 80px rgba(0,0,80,.5);padding:20px}
.modal-head{display:flex;gap:12px;align-items:flex-start}.modal-head h3{margin:0;font-size:20px}.close{margin-left:auto;border:0;background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:50%;font-size:22px}.copy-btn{margin-top:14px;border:1px solid rgba(190,242,255,.72);background:linear-gradient(135deg,#67ddff,#178cff);color:#05265e;border-radius:12px;padding:10px 15px;font-weight:900;box-shadow:0 0 20px rgba(70,210,255,.2)}.copy-btn.copied{background:linear-gradient(135deg,#8fffc0,#2bd67b);color:#063b25}.detail{margin-top:17px;line-height:1.65;color:#f3fbff;white-space:pre-wrap}.detail-block{margin-top:15px;padding:12px 14px;border-radius:14px;background:rgba(0,24,85,.35);border:1px solid rgba(175,235,255,.25)}.detail-block b{display:block;color:#aef0ff;margin-bottom:5px}
.analysis{display:none;margin-top:20px}.analysis.show{display:block}.analysis-card{border:1px solid rgba(176,239,255,.55);border-radius:20px;background:rgba(3,43,125,.58);padding:18px;backdrop-filter:blur(12px)}.analysis textarea{width:100%;min-height:120px;resize:vertical;border-radius:14px;border:1px solid rgba(175,237,255,.45);background:rgba(0,24,88,.48);color:#fff;padding:13px;outline:none}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid rgba(175,238,255,.6);background:linear-gradient(135deg,#67ddff,#178cff);color:#05265e;font-weight:800;border-radius:12px;padding:10px 14px}.btn.secondary{background:rgba(255,255,255,.1);color:#fff}.result{margin-top:14px}.match{padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid rgba(180,238,255,.2);margin:7px 0}.match b{color:#aef0ff}
.top{position:fixed;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(190,242,255,.7);background:rgba(5,46,133,.75);color:#fff;display:none;z-index:10;box-shadow:0 8px 30px rgba(0,30,110,.35)}.top.show{display:block}
.footer{text-align:center;color:#d9efff;font-size:11px;margin-top:28px;opacity:.9}
@media(max-width:700px){.container{width:min(100% - 18px,1120px);padding-top:12px}.header{padding-bottom:15px}.logo{width:48px;height:48px}.brand h1{font-size:25px}.header-actions{gap:5px}.icon-btn{width:39px;height:39px}.stats{gap:7px}.stat{padding:11px 10px;min-height:72px}.stat strong{font-size:19px}.stat-icon{font-size:22px}.stat small{font-size:10px}.branch-head{padding:14px 12px}.branch-name b{font-size:15px}.rule{padding:11px 12px}.pun{display:none}.modal{padding:8px}.modal-card{max-height:92vh;border-radius:20px;padding:16px}}
</style>
</head>
<body>
<div class="container" id="top">
  <header class="header">
    <div class="brand">
      <div class="logo">♛</div>
      <div><h1>VERBA ONLINE</h1><p>Офіційний збірник правил</p></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="Тема">☾</button>
      <button class="icon-btn" id="fontBtn" title="Розмір тексту">Aᴬ</button>
      <button class="icon-btn" id="infoBtn" title="Про застосунок">ⓘ</button>
    </div>
  </header>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" class="search" type="search" placeholder="Пошук за номером або ключовим словом..." autocomplete="off">
  </div>

  <nav class="tabs" id="tabs"></nav>

  <div class="quick-tools home-only" id="quickTools">
    <button class="tool-btn" id="punishmentFilter">⚖️ З покаранням</button>
    <button class="tool-btn" id="analysisOpenBtn">🔎 Розбір ситуації</button>
  </div>

  <div class="stats">
    <div class="stat"><span class="stat-icon">▱</span><div><small>Усього правил</small><strong id="totalRules">0</strong></div></div>
    <div class="stat"><span class="stat-icon">▱</span><div><small>Розділів</small><strong id="totalSections">0</strong></div></div>
    <div class="stat"><span class="stat-icon">☷</span><div><small>Пунктів</small><strong id="visibleRules">0</strong></div></div>
  </div>

  <main id="rulesView" class="home-only"></main>

  <section class="category-view" id="categoryView"></section>

  <section class="analysis" id="analysisView">
    <div class="section-title"><h2>🔎 Розбір ситуації</h2><span>Пошук найбільш релевантних пунктів</span></div>
    <div class="analysis-card">
      <textarea id="situation" placeholder="Опишіть ситуацію своїми словами..."></textarea>
      <div class="btns"><button class="btn" id="analyzeBtn">Знайти правила</button><button class="btn secondary" id="backToRules">← До всіх правил</button></div>
      <div class="result" id="analysisResult"></div>
    </div>
  </section>

  <div class="footer">Verba Online · Правила проєкту</div>
</div>

<button class="top" id="topBtn">↑</button>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head"><div><div class="rid" id="modalId"></div><h3 id="modalTitle"></h3></div><button class="close" id="closeModal">×</button></div>
    <div class="detail" id="modalText"></div>
    <div class="detail-block" id="punishmentBlock"><b>Покарання</b><div id="modalPunishment"></div></div>
    <div class="detail-block" id="notesBlock"><b>Примітка</b><div id="modalNotes"></div></div>
    <div class="detail-block" id="examplesBlock"><b>Приклад</b><div id="modalExamples"></div></div>
    <button class="copy-btn" id="copyRuleBtn">📋 Копіювати правило</button>
  </div>
</div>

<script>
const CATEGORIES = [
  'Основні правила',
  'Правила сімей',
  'Правила війни за бізнес',
  'Правила військового складу',
  'Правила лідерів та заступників',
  'Правила подачі скарг'
];

const CATEGORY_ICONS = ['▦','♟','♛','⚔','♕','▤'];
const CATEGORY_PREFIXES = {
  'Основні правила':'ЗПП',
  'Правила сімей':'ЗПС',
  'Правила війни за бізнес':'ПВЗБ',
  'Правила військового складу':'ПВС',
  'Правила лідерів та заступників':'ПЛЗ',
  'Правила подачі скарг':'ППС'
};
let RULES=[];
let activeCategory='Усі';
let viewMode='home';
let fontScale=1;
let punishmentOnly=false;

const $=s=>document.querySelector(s);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const normalize=s=>String(s??'').toLowerCase().replace(/ё/g,'е').replace(/ґ/g,'г');

async function loadRules(){
  try{
    const res=await fetch('rules.json',{cache:'no-store'});
    if(!res.ok) throw new Error('rules.json '+res.status);
    RULES=await res.json();
  }catch(e){
    try{
      const res=await fetch('https://raw.githubusercontent.com/mashaturta-sudo/verba-rules/main/rules.json',{cache:'no-store'});
      if(!res.ok) throw new Error('GitHub '+res.status);
      RULES=await res.json();
    }catch(err){
      $('#rulesView').innerHTML='<div class="empty">Не вдалося завантажити правила. Перевірте, що файл <b>rules.json</b> знаходиться поруч із index.html.</div>';
      return;
    }
  }
  init();
}

function init(){
  $('#totalRules').textContent=RULES.length;
  buildTabs();
  render();
}

function buildTabs(){
  const tabs=$('#tabs');
  tabs.innerHTML='';
  const all=document.createElement('button');
  all.className='tab '+(activeCategory==='Усі'?'active':'');
  all.textContent='▦  Усі правила';
  all.onclick=()=>{activeCategory='Усі';viewMode='home';punishmentOnly=false;document.body.classList.remove('category-mode');$('#analysisView').classList.remove('show');$('#rulesView').style.display='block';$('#categoryView').style.display='none';render();buildTabs();window.scrollTo({top:0,behavior:'smooth'})};
  tabs.appendChild(all);
  CATEGORIES.forEach((cat,i)=>{
    const b=document.createElement('button');
    b.className='tab '+(activeCategory===cat?'active':'');
    b.textContent=CATEGORY_ICONS[i]+'  '+cat;
    b.onclick=()=>{activeCategory=cat;viewMode='category';punishmentOnly=false;document.body.classList.add('category-mode');$('#analysisView').classList.remove('show');$('#rulesView').style.display='none';$('#categoryView').style.display='block';render();buildTabs();window.scrollTo({top:0,behavior:'smooth'})};
    tabs.appendChild(b);
  });
}

function ruleDisplayId(r){
  const prefix=CATEGORY_PREFIXES[r.category]||'';
  return prefix ? `${prefix} ${r.id}` : r.id;
}

function filteredRules(){
  const q=normalize($('#search').value.trim());
  return RULES.filter(r=>{
    const catOk=activeCategory==='Усі'||r.category===activeCategory;
    if(!catOk) return false;
    if(punishmentOnly && !String(r.punishment||'').trim()) return false;
    if(!q) return true;
    return [r.id,ruleDisplayId(r),r.text,r.section,r.punishment,r.notes,r.examples,r.category].some(v=>normalize(v).includes(q));
  });
}

function sectionMap(rules){
  const map=new Map();
  rules.forEach(r=>{const key=r.section||'Інші правила';if(!map.has(key))map.set(key,[]);map.get(key).push(r)});
  return map;
}

function render(){
  const rules=filteredRules();
  $('#visibleRules').textContent=rules.length;
  $('#totalSections').textContent=new Set(rules.map(r=>r.section||'Інші правила')).size;

  if(viewMode==='category' && activeCategory!=='Усі'){
    renderCategoryPage(rules);
    return;
  }

  const view=$('#rulesView');
  if(!rules.length){view.innerHTML='<div class="empty">Нічого не знайдено.<br><small>Спробуйте інший номер або ключове слово.</small></div>';return}

  const groups=CATEGORIES.map(c=>[c,rules.filter(r=>r.category===c)]).filter(x=>x[1].length);
  view.innerHTML='';
  groups.forEach(([category,catRules],catIndex)=>{
    const outer=document.createElement('section');
    outer.className='branch';
    const sections=sectionMap(catRules);
    const prefix=CATEGORY_PREFIXES[category]||'';
    outer.innerHTML=`<button class="branch-head"><div class="num">${catIndex+1}</div><div class="branch-name"><b><span class="category-prefix">${escapeHtml(prefix)}</span> ${escapeHtml(category)}</b><small>${catRules.length} ${plural(catRules.length,'правило','правила','правил')}</small></div><div class="chev">⌄</div></button><div class="branch-body"></div>`;
    outer.querySelector('.branch-head').onclick=()=>{
      activeCategory=category;
      viewMode='category';
      punishmentOnly=false;
      document.body.classList.add('category-mode');
      $('#rulesView').style.display='none';
      $('#categoryView').style.display='block';
      $('#analysisView').classList.remove('show');
      buildTabs();
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    };
    const body=outer.querySelector('.branch-body');
    sections.forEach((items,section)=>{
      const sub=document.createElement('div');sub.className='subbranch';
      sub.innerHTML=`<button class="sub-head"><b>🪻 ${escapeHtml(section)}</b><span>${items.length}</span><span>⌄</span></button><div class="sub-body"></div>`;
      sub.querySelector('.sub-head').onclick=()=>sub.classList.toggle('open');
      const sb=sub.querySelector('.sub-body');
      items.forEach(r=>{
        const card=document.createElement('article');card.className='rule';
        card.innerHTML=`<div class="rule-top"><span class="rid">${escapeHtml(ruleDisplayId(r))}</span>${r.punishment?`<span class="pun">${escapeHtml(r.punishment)}</span>`:''}</div><div class="rtext">${escapeHtml(r.text)}</div>${(r.notes||r.examples)?`<div class="meta">${r.notes?'<span class="tag">Примітка</span>':''}${r.examples?'<span class="tag">Приклад</span>':''}</div>`:''}`;
        card.onclick=()=>openRule(r);
        sb.appendChild(card);
      });
      body.appendChild(sub);
    });
    view.appendChild(outer);
  });

  if($('#search').value.trim()) document.querySelectorAll('.branch').forEach(b=>b.classList.add('open'));
}

function renderCategoryPage(rules){
  const view=$('#categoryView');
  const cat=activeCategory;
  view.innerHTML='';
  const toolbar=document.createElement('div');
  toolbar.className='category-toolbar';
  toolbar.innerHTML=`<button class="back-btn" id="backToCategories">← До вибору правил</button><div class="category-heading"><b>${escapeHtml(cat)}</b><small>${rules.length} ${plural(rules.length,'правило','правила','правил')}</small></div>`;
  view.appendChild(toolbar);

  if(!rules.length){
    view.insertAdjacentHTML('beforeend','<div class="empty">Нічого не знайдено.<br><small>Спробуйте інший номер або ключове слово.</small></div>');
  } else {
    const sections=sectionMap(rules);
    sections.forEach((items,section)=>{
      const wrap=document.createElement('section');wrap.className='strip-section';
      wrap.innerHTML=`<div class="strip-section-title"><span>🪻</span>${escapeHtml(section)}<span>${items.length} ${plural(items.length,'пункт','пункти','пунктів')}</span></div>`;
      items.forEach(r=>{
        const row=document.createElement('button');row.className='rule-strip';
        row.innerHTML=`<span class="strip-id">${escapeHtml(ruleDisplayId(r))}</span><span class="strip-text">${escapeHtml(r.text)}</span>${r.punishment?`<span class="strip-pun">${escapeHtml(r.punishment)}</span>`:''}`;
        row.onclick=()=>openRule(r);
        wrap.appendChild(row);
      });
      view.appendChild(wrap);
    });
  }
  $('#backToCategories').onclick=()=>{
    activeCategory='Усі';
    punishmentOnly=false;
    viewMode='home';
    document.body.classList.remove('category-mode');
    $('#rulesView').style.display='block';
    $('#categoryView').style.display='none';
    $('#analysisView').classList.remove('show');
    buildTabs();
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
}

function plural(n,a,b,c){const m=n%10;const t=n%100;return m===1&&t!==11?a:(m>=2&&m<=4&&(t<12||t>14)?b:c)}

function openRule(r){
  $('#modalId').textContent=ruleDisplayId(r);
  $('#modalTitle').textContent=r.section||r.category||'Правило';
  $('#modalText').textContent=r.text||'';
  setBlock('#punishmentBlock','#modalPunishment',r.punishment);
  setBlock('#notesBlock','#modalNotes',r.notes);
  setBlock('#examplesBlock','#modalExamples',r.examples);
  $('#modal').classList.add('show');
}
function setBlock(block,el,val){$(block).style.display=val?'block':'none';$(el).textContent=val||''}

$('#copyRuleBtn').onclick=async()=>{
  const id=$('#modalId').textContent.trim();
  const title=$('#modalTitle').textContent.trim();
  const text=$('#modalText').textContent.trim();
  const punishment=$('#modalPunishment').textContent.trim();
  const notes=$('#modalNotes').textContent.trim();
  const examples=$('#modalExamples').textContent.trim();
  let out=`${id} ${text}`;
  if(punishment) out+=`\n\nПокарання: ${punishment}`;
  if(notes) out+=`\n\nПримітка: ${notes}`;
  if(examples) out+=`\n\nПриклад: ${examples}`;
  try{
    await navigator.clipboard.writeText(out);
  }catch(e){
    const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
  const b=$('#copyRuleBtn');
  const old=b.textContent;
  b.textContent='✓ Скопійовано';b.classList.add('copied');
  setTimeout(()=>{b.textContent=old;b.classList.remove('copied')},1400);
};
$('#closeModal').onclick=()=>$('#modal').classList.remove('show');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show')});

$('#search').addEventListener('input',render);
$('#infoBtn').onclick=()=>openRule({id:'VERBA RULES',section:'Про застосунок',text:'Офіційний довідник правил Verba Online. Правила завантажуються з локального файлу rules.json, а за потреби — з GitHub.',punishment:'',notes:'',examples:''});
$('#fontBtn').onclick=()=>{fontScale=fontScale===1?1.12:fontScale===1.12?1.25:1;document.documentElement.style.fontSize=(16*fontScale)+'px'};
$('#themeBtn').onclick=()=>{document.body.classList.toggle('soft');if(document.body.classList.contains('soft')){document.body.style.background='linear-gradient(180deg,#168bff 0%,#55bfff 55%,#d7f7ff 100%)';}else{document.body.style.background='linear-gradient(180deg,#0038e8 0%,#0759ff 25%,#168bff 55%,#65d8ff 82%,#c9f4ff 100%)'}};

$('#punishmentFilter').onclick=()=>{punishmentOnly=!punishmentOnly;$('#punishmentFilter').classList.toggle('active',punishmentOnly);render();};
$('#analysisOpenBtn').onclick=()=>{
  $('#rulesView').style.display='none';
  $('#categoryView').style.display='none';
  $('#analysisView').classList.add('show');
  document.body.classList.remove('category-mode');
  window.scrollTo({top:0,behavior:'smooth'});
};

$('#analyzeBtn').onclick=()=>{
  const q=normalize($('#situation').value.trim());const out=$('#analysisResult');
  if(!q){out.innerHTML='<div class="empty">Опишіть ситуацію, щоб знайти релевантні правила.</div>';return}
  const words=q.split(/\s+/).filter(w=>w.length>3);
  const scored=RULES.map(r=>{const hay=normalize([r.id,r.text,r.section,r.punishment,r.notes,r.examples].join(' '));let score=0;words.forEach(w=>{if(hay.includes(w))score++});return {r,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);
  if(!scored.length){out.innerHTML='<div class="empty">Точних збігів не знайдено.</div>';return}
  out.innerHTML=scored.map(x=>`<div class="match"><b>${escapeHtml(x.r.id)}</b> · ${escapeHtml(x.r.category)}<br>${escapeHtml(x.r.text)}${x.r.punishment?`<br><small>Покарання: ${escapeHtml(x.r.punishment)}</small>`:''}</div>`).join('');
};
$('#backToRules').onclick=()=>{punishmentOnly=false;$('#analysisView').classList.remove('show');$('#rulesView').style.display='block';$('#categoryView').style.display='none';viewMode='home';activeCategory='Усі';document.body.classList.remove('category-mode');buildTabs();render();window.scrollTo({top:0,behavior:'smooth'})};

window.addEventListener('scroll',()=>$('#topBtn').classList.toggle('show',window.scrollY>500));
$('#topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
loadRules();
</script>
</body>
