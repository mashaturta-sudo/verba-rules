<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Verba Rules</title>
<style>
:root{--bg:#0b0e13;--card:#141923;--card2:#1a202c;--text:#f4f6fa;--muted:#9da7b8;--accent:#7c5cff;--accent2:#9a83ff;--danger:#ff667d;--ok:#42d392;--line:#252c39}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#251b52 0,#0b0e13 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{padding:22px 18px 14px;position:sticky;top:0;z-index:5;background:rgba(11,14,19,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-size:25px;font-weight:800;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.search{margin-top:15px;display:flex;gap:8px}.search input{width:100%;background:#111620;border:1px solid #303747;border-radius:14px;color:var(--text);padding:14px 15px;font-size:16px;outline:none}.search input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 18px 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 12px;border-radius:999px;font-size:13px}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:10px 18px 90px;max-width:900px;margin:auto}.tools{display:flex;gap:8px;margin:10px 0 14px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px}.btn.active{border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:linear-gradient(145deg,#171d28,#11151d);border:1px solid var(--line);border-radius:14px;padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}
.rule{background:linear-gradient(145deg,#151b26,#11151d);border:1px solid var(--line);border-radius:16px;padding:15px;margin:9px 0;cursor:pointer}.rule:active{transform:scale(.995)}.rid{color:#a992ff;font-weight:800;font-size:14px}.rtitle{font-weight:700;margin:4px 0 7px;font-size:15px}.rtext{color:#d6dbe4;font-size:13px;line-height:1.45}.pun{display:inline-block;margin-top:9px;background:rgba(255,102,125,.1);border:1px solid rgba(255,102,125,.25);color:#ff9aaa;border-radius:9px;padding:5px 8px;font-size:11px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}.fab{position:fixed;right:18px;bottom:20px;background:var(--accent);border:0;color:white;border-radius:18px;padding:14px 16px;font-weight:800;box-shadow:0 10px 35px rgba(124,92,255,.35)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:20;display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#11161f;border-top:1px solid #303747;border-radius:22px 22px 0 0;padding:20px 18px 30px}.close{float:right;border:0;background:#252c39;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px}.detail h2{margin:5px 45px 5px 0}.detail .section{color:var(--muted);font-size:12px}.block{margin-top:17px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.value{font-size:15px;line-height:1.55}.punbig{color:#ff9aaa;font-weight:800}.note{background:#191b2b;border:1px solid #34324c;padding:12px;border-radius:12px;color:#ddd8ff}
.analysis{display:none}.analysis.show{display:block}.analysis textarea{width:100%;min-height:130px;background:#111620;border:1px solid #303747;border-radius:14px;color:#fff;padding:13px;font:inherit;resize:vertical}.result{margin-top:12px}
.small{font-size:12px;color:var(--muted);line-height:1.4}
@media(min-width:700px){.overlay{align-items:center}.sheet{max-width:760px;border-radius:22px}.rule{padding:17px}}
</style>
</head>
<body>
<header>
  <div class="brand">⚖️ Verba Rules</div>
  <div class="sub">Довідник правил для кураторів та адміністраторів</div>
  <div class="search"><input id="search" placeholder="Пошук: 5.14, NonRP, DM, майно..."></div>
</header>
<div class="tabs" id="tabs"></div>
<main>
  <div class="stats">
    <div class="stat"><b id="count">0</b><span>знайдено правил</span></div>
    <div class="stat"><b id="sectionCount">8</b><span>розділів</span></div>
    <div class="stat"><b>8.1</b><span>межа новачка</span></div>
  </div>
  <div class="tools">
    <button class="btn active" id="allBtn">Усі</button>
    <button class="btn" id="punBtn">З покаранням</button>
    <button class="btn" id="analysisBtn">Розбір ситуації</button>
  </div>
  <section id="list"></section>
  <section class="analysis" id="analysis">
    <h2>Розбір ситуації</h2>
    <button class="btn" id="backToRules">← До всіх правил</button>
    <p class="small">Опиши, що сталося. Застосунок підбере найбільш схожі правила за ключовими словами. Це довідкова підказка — остаточне рішення приймається за фактичними обставинами.</p>
    <textarea id="situation" placeholder="Наприклад: гравець під час переслідування вийшов із гри..."></textarea>
    <div class="tools"><button class="btn active" id="analyze">Знайти правила</button></div>
    <div class="result" id="result"></div>
  </section>
</main>
<button class="fab" id="top">↑ На початок</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close" id="close">×</button>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
const RULES = [{"section": "Загальні положення", "id": "1.1", "text": "Верба Онлайн — україномовний РП проєкт. Усі учасники, незалежно від рівня досвіду чи статусу, зобов'язані дотримуватись цих правил з моменту першого входу на будь-який ресурс проєкту.", "punishment": "", "notes": "", "examples": ""}, {"section": "Загальні положення", "id": "1.2", "text": "Правила діють однаково для всіх — новачків і досвідчених гравців, донатерів і звичайних учасників. Жодних винятків за статусом не існує.", "punishment": "", "notes": "", "examples": ""}, {"section": "Загальні положення", "id": "1.3", "text": "Актуальна версія правил завжди розміщена на офіційних ресурсах проєкту. Керівництво може вносити зміни без попереднього повідомлення.", "punishment": "", "notes": "", "examples": ""}, {"section": "Загальні положення", "id": "1.4", "text": "Адміністрація діє в інтересах проєкту та його учасників. Вона не втручається в рольовий процес, не надає ігрові переваги і не запитує даних від акаунтів — якщо хтось робить це від імені адміністрації, слід негайно повідомити про це.", "punishment": "", "notes": "Способи зв'язку з адміністрацією: офіційні ресурси проєкту — Discord, внутрішньоігровий report, технічна підтримка.", "examples": ""}, {"section": "Загальні положення", "id": "1.5", "text": "Покарання видаються відповідно до правил. У виняткових або нестандартних ситуаціях головна адміністрація має право відступити від стандартної шкали покарань із обов'язковим поясненням рішення.", "punishment": "", "notes": "", "examples": ""}, {"section": "Загальні положення", "id": "1.6", "text": "Якщо певна ситуація не описана у правилах, але очевидно суперечить принципам чесної гри — керівництво має право видати покарання на власний розсуд. Такі випадки надалі фіксуються у регламенті.", "punishment": "", "notes": "", "examples": ""}, {"section": "Загальні положення", "id": "1.7", "text": "Скарги, апеляції та будь-які офіційні звернення розглядаються виключно через визначені канали проєкту. Адміністрація не зобов'язана реагувати на звернення поза ними.", "punishment": "", "notes": "", "examples": ""}, {"section": "Загальні положення", "id": "1.8", "text": "Адміністрація не несе відповідальності за збереження акаунтів, ігрового майна та особистих даних гравців у разі їх втрати з будь-якої причини.", "punishment": "", "notes": "", "examples": ""}, {"section": "Загальні положення", "id": "1.9", "text": "Нерухомість (будинки, квартири, бізнеси) є ключовим елементом економіки проєкту. Для утримання майна гравець зобов'язаний проявляти регулярну ігрову активність. У разі тривалої відсутності власника в грі, система залишає за собою право автоматично анулювати право власності та повернути майно на користь держави. Алгоритми оцінки активності є динамічними і не розголошуються з метою уникнення штучних накруток онлайну.", "punishment": "", "notes": "", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.1", "text": "Нікнейм має відповідати формату Ім'я_Прізвище, латиницею, ім’я та прізвище реально існуючі, не вигадані слова/прізвиська/абревіатури.", "punishment": "", "notes": "Коректні приклади: Andriy_Bondar, Sofia_Lytvyn. Некоректні: Ghost_Kill, Maloy_Tawer, SASHA_TOP.", "examples": "За потреби можна скористатися генератором RP-нікнеймів."}, {"section": "Обліковий запис та нікнейм", "id": "2.2", "text": "Нік не може містити випадкове використання великих/малих літер, нецензурну лексику або натяки, образи, рекламу чи навмисну схожість із нікнеймом члена команди проєкту.", "punishment": "Попередження з вимогою зміни нікнейма / перманентний блок залежно від характеру порушення.", "notes": "Усі випадки належать до оформлення нікнейма; капслок та реклама можуть мати різні покарання.", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.3", "text": "Забороняється перекручувати або спотворювати нікнейми інших гравців, адміністраторів чи членів команди проєкту у будь-якому контексті.", "punishment": "Ban 7 days / Permanent block", "notes": "", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.4", "text": "Акаунт належить лише його творцю. Передача, продаж та спільне використання акаунта заборонені.", "punishment": "Permanent account block", "notes": "", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.5", "text": "Заборонено видавати себе за адміністратора або члена команди проєкту.", "punishment": "Ban 7 days", "notes": "", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.6", "text": "Будь-яка торгівля ігровими цінностями за реальні гроші — акаунтами, валютою, майном чи будь-чим, що має ігрову цінність (завершена передача).", "punishment": "Permanent block", "notes": "", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.6.1", "text": "Спроба торгівлі за реальні гроші, прямі/завуальовані пропозиції або жарти про це в будь-яких ігрових чатах.", "punishment": "Ban 15 days", "notes": "", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.7", "text": "Заборонено обмінюватися ігровими цінностями між різними серверами проєкту.", "punishment": "Permanent account block on all servers", "notes": "", "examples": ""}, {"section": "Обліковий запис та нікнейм", "id": "2.8", "text": "Заборонена участь у рекламних акціях/конкурсах на сторонніх ресурсах, пов’язаних із торгівлею ігровими цінностями.", "punishment": "Permanent account block", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.1", "text": "Стороннє програмне забезпечення/чити (speed, aimbot, збільшена видимість тощо).", "punishment": "Ban 30 days / Permanent block", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.2", "text": "Навмисне використання багів мода/гри для власної вигоди.", "punishment": "Jail 60 min / Ban 7–15 days", "notes": "Про виявлений баг потрібно одразу повідомити адміністрацію через report/Discord; своєчасне повідомлення є пом’якшувальною обставиною.", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.3", "text": "Використання багів для отримання ігрових цінностей.", "punishment": "Permanent block", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.4", "text": "Обхід офіційних ігрових систем способом, не передбаченим розробником.", "punishment": "Ban 14–30 days / Permanent block", "notes": "Наприклад: переказ коштів через продаж предметів за нереалістичною ціною замість банківського переказу або офіційного меню обміну.", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.5", "text": "Навмисне підставляння гравців, лідерів чи адміністраторів (неправдива інформація, провокації, маніпуляції).", "punishment": "Ban 14 days", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.6", "text": "Вимагання грошей, майна або послуг під тиском (погрози, шантаж, штучні обмеження).", "punishment": "Ban 14 days / Permanent block", "notes": "Приклад: «Передай кошти або я подам скаргу». Виняток: офіційні внески та штрафи в межах RP-механік.", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.7", "text": "Розпалювання ворожнечі (расизм, нацистська символіка, релігійні провокації, заклики до насильства, заборонені ідеології).", "punishment": "Mute 180 min / Ban 7–30 days", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.8", "text": "Співпраця з особами, внесеними до чорного списку або підтвердженими порушниками.", "punishment": "Same as offender", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.9", "text": "Поширення внутрішньої інформації проєкту (адмінматеріали, закриті чати, системні дані).", "punishment": "Permanent account block", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.10", "text": "Навмисна дестабілізація економіки (масові роздачі, маніпуляції цінами).", "punishment": "Ban 14–30 days / Permanent block", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.11", "text": "Зловживання повноваженнями керівника/фракції/сім’ї/адміністратора на шкоду гравцям або проєкту.", "punishment": "Ban 30 days / Permanent block", "notes": "Навмисне повне очищення складу фракції/сім’ї, крадіжка матеріалів/боєприпасів/бюджету в особливо великих обсягах, необґрунтовані масові звільнення або зміни рангів.", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.12", "text": "Введення адміністрації в оману (неправдиві пояснення, фальшиві докази, приховування обставин).", "punishment": "Ban 7–30 days / Permanent block", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.13", "text": "Перешкоджання роботі адміністратора під час виконання ним службових обов’язків.", "punishment": "Kick / Jail 10 min", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.14", "text": "Ухилення від покарання (зміна нікнейма, передача майна на інші акаунти тощо).", "punishment": "Additional ban 14–30 days + main punishment", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.15", "text": "Зловживання прогалинами правил / дії всупереч духу правил.", "punishment": "At management discretion", "notes": "Очевидне порушення без прямого пункту може каратися на розсуд адміністрації та надалі фіксуватися в регламенті.", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.16", "text": "Передача грошей/майна за посаду, підвищення або призначення у фракції чи адміністрації.", "punishment": "Permanent block all involved accounts", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.17", "text": "AFK на дорозі, спавні чи проходах, якщо це перешкоджає іншим.", "punishment": "Kick", "notes": "", "examples": ""}, {"section": "Загальні правила поведінки на сервері", "id": "3.18", "text": "Переривання/ламання ігрової анімації (стрільба, маска, аптечка, ремкомплект тощо).", "punishment": "Jail 60 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.1", "text": "Образа/приниження/цькування інших гравців поза рольовою грою (OOC).", "punishment": "Mute 30–120 min", "notes": "Виняток: RP-ситуації, де висловлювання є частиною гри персонажа і не є реальною образою гравця.", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.2", "text": "Надмірна нецензурна лексика в неігрових чатах (VIP, робочі чати, OOC).", "punishment": "Mute 10 min", "notes": "IC-лайка дозволена лише як рольова гра персонажа, без образи або прямої реальної образи гравця.", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.3", "text": "Образа батьків/родичів/близьких у будь-якому контексті.", "punishment": "Ban 7–14 days", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.4", "text": "Згадування батьків/родичів/близьких у жартівливому або образливому контексті (недоречні питання, завуальовані натяки, жарти, кліше).", "punishment": "Mute 120 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.5", "text": "Будь-яка дискримінація, расизм, нацизм, сексизм.", "punishment": "Mute 120 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.6", "text": "Використання ігрових анімацій та RP-команд (/me, /do, /todo) для сексуального або морального приниження.", "punishment": "Jail 60–120 min / Mute 60 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.7", "text": "Образа/дискредитація адміністраторів, погрози скаргами/зняттям для тиску.", "punishment": "Mute 60–120 min", "notes": "Якщо дії адміністратора незаконні/несправедливі — офіційна скарга; погрози та публічний тиск не є допустимою альтернативою.", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.8", "text": "Флуд: повторювані/безглузді повідомлення, надмірне повторення символів, повторення одного тексту більше двох разів.", "punishment": "Mute 10 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.9", "text": "Повний верхній регістр/capslock заборонений; виняток — поширені скорочення.", "punishment": "Mute 10 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.10", "text": "Музика/пісні/voice changer у голосовому чаті без згоди учасників поточної RP-ситуації.", "punishment": "Mute 15 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.11", "text": "Реклама сторонніх ресурсів у будь-якому чаті — серверів, сайтів, соцмереж, каналів.", "punishment": "Mute 60 min / Ban 7–30 days", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.12", "text": "Висловлювання, що розпалюють міжетнічну/релігійну ворожнечу, пропагують нацизм/расизм, політичні провокації у будь-якій формі.", "punishment": "Mute 60 min", "notes": "Обговорення подій, пов’язаних із російською агресією проти України, виключене з цього правила.", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.13", "text": "Публічне обговорення або критика рішень адміністратора в будь-якому чаті; для цього існують офіційні скарги/апеляції.", "punishment": "Mute 30 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.14", "text": "Погрози іншим гравцям/адміністраторам у реальному житті незалежно від чату.", "punishment": "Mute 60–120 min / Ban 3–7 days", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.15", "text": "Видавати себе за адміністратора/члена команди в будь-якому чаті.", "punishment": "Mute 120 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.16", "text": "/me, /do, /try використовуються лише для дій/описів персонажа; зловживання, насмішки та провокації заборонені.", "punishment": "Mute 5–20 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.17", "text": "MG (Metagaming): використання реальної/OOC інформації в IC.", "punishment": "Mute 20 min", "notes": "Приклади: «адмін», «пінг», «Discord», «залагало», «крашнуло», «тп сюди». Для неігрових тем існує OOC-чат.", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.18", "text": "/me і /do можна озвучувати в голосовому чаті, якщо це чітко та зрозуміло. Якщо хоча б один учасник не чує голосовий чат, дію потрібно дублювати в текстовому чаті.", "punishment": "", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.19", "text": "Фракційні/робочі чати призначені лише для внутрішнього спілкування та координації. Купівля/продаж/обмін майном у цих чатах заборонені.", "punishment": "Mute 10 min", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.20", "text": "VIP, новачковий та основний робочий чат за замовчуванням є OOC і не підпадають під вимоги IC-спілкування.", "punishment": "", "notes": "", "examples": ""}, {"section": "Правила спілкування та чатів", "id": "4.21", "text": "Публічні образи проєкту, неправдива інформація, токсична/неконструктивна критика роботи розробників/адміністрації заборонені.", "punishment": "Mute 60–120 min / Ban 3–30 days", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.1", "text": "Навмисне уникнення RP, ігнорування взаємодії, вихід із RP без обґрунтованої причини.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.2", "text": "Вихід із гри під час активної RP-ситуації (переслідування, бій, викрадення, затримання, незавершена взаємодія).", "punishment": "Jail 60 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.3", "text": "AFK для уникнення смерті/затримання/викрадення/RP.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.4", "text": "DM (Death Match): нанесення шкоди/вбивство без обґрунтованої IC-причини.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.5", "text": "Mass DM: нанесення шкоди/вбивство 3+ гравців без обґрунтованої IC-причини.", "punishment": "Jail 120 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.6", "text": "DM у громадських місцях/GZ (Green Zone): нанесення шкоди/вбивство у місцях із великою кількістю гравців.", "punishment": "Jail 120 min", "notes": "GZ включає бази організацій та прилеглу територію, робочі/розважальні/торгові/медичні місця та інші локації масового скупчення гравців.", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.7", "text": "TK: нанесення шкоди/вбивство члена власної фракції/команди.", "punishment": "Jail 20 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.8", "text": "Mass TK: нанесення шкоди/вбивство 3+ членів власної фракції/команди.", "punishment": "Jail 60 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.9", "text": "RK (Revenge Kill): повернення на місце власної смерті протягом 15 хвилин або завдання шкоди гравцю, який нещодавно вас убив.", "punishment": "Jail 20 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.10", "text": "RPK (Repeat Kill): навмисне багаторазове вбивство одного й того самого гравця за короткий час.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.11", "text": "SK (Spawn Kill): нанесення шкоди/вбивство безпосередньо на точці респавну.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.12", "text": "Mass SK: нанесення шкоди/вбивство 3+ гравців на спавні.", "punishment": "Jail 120 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.13", "text": "PG (Powergaming): надлюдська гра, ігнорування самозбереження, фізично неможливі дії.", "punishment": "Jail 20 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.14", "text": "NonRP: дії, що суперечать логіці реального світу, руйнують RP-атмосферу та не мають пояснення від персонажа.", "punishment": "Jail 20 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.15", "text": "Втручання в RP-ситуації, які не стосуються вашого персонажа: бігати навколо учасників, провокувати, заважати.", "punishment": "Jail 10 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.16", "text": "Примушування іншого гравця до RP, утримання проти волі, використання RP для булінгу/залякування поза виправданим ігровим контекстом.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.17", "text": "Провокація іншого гравця на порушення правил із подальшим поданням скарги.", "punishment": "Double punishment under relevant rule", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.18", "text": "DB (Drive By): нанесення шкоди/вбивство іншого персонажа з рухомого транспортного засобу.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.19", "text": "Mass DB: нанесення шкоди/вбивство 3+ гравців із транспортного засобу.", "punishment": "Jail 60 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.20", "text": "Навмисний ramming: свідоме зіткнення, перевертання автомобіля, агресивне підрізання з контактом.", "punishment": "Jail 30 min", "notes": "Виняток: ramming дозволений за наявності обґрунтованої IC-причини в межах активного RP.", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.21", "text": "Правоохоронцям заборонено затримувати/обшукувати/штрафувати без обґрунтованої IC-причини та належного RP.", "punishment": "Jail 60 min / Warn", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.22", "text": "Не можна використовувати приналежність гравця до фракції або колір маркера як підставу для затримання чи інших дій.", "punishment": "Jail 30 min", "notes": "", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.23", "text": "Не можна затримувати гравця без зірок розшуку.", "punishment": "Jail 30 min", "notes": "Виняток: правоохоронець може затримати без зірок за наявності фото/відеодоказу конкретного правопорушення.", "examples": ""}, {"section": "Правила Role Play поведінки", "id": "5.24", "text": "Не можна уникати переслідування поліції, ховаючись у закритих інтер’єрах або переміщуючись через воду.", "punishment": "Jail 60 min", "notes": "", "examples": ""}, {"section": "Економіка та майно", "id": "6.1", "text": "Будь-яка передача ігрових цінностей (гроші, майно, предмети) здійснюється лише через офіційні ігрові системи.", "punishment": "Ban 30 days / Permanent block", "notes": "Неофіційний переказ — будь-який спосіб обходу стандартної механіки, наприклад продаж предметів за нереалістичною ціною або штучний обмін.", "examples": ""}, {"section": "Економіка та майно", "id": "6.2", "text": "Будь-який перепродаж майна зі штучним завищенням/заниженням ціни для переказу грошей заборонений.", "punishment": "Permanent block", "notes": "Наприклад: гравець A продає будинок B за 1 000, а B продає той самий будинок назад за 500 000 — прихований переказ грошей незалежно від форми.", "examples": ""}, {"section": "Економіка та майно", "id": "6.3", "text": "Заборонена безкоштовна передача значної суми грошей або цінного майна.", "punishment": "Permanent block", "notes": "Порушення, якщо передача становить 30% або більше від загальної вартості придбаного майна; правило діє навіть між друзями/знайомими.", "examples": ""}, {"section": "Економіка та майно", "id": "6.4", "text": "Якщо на рахунок від невідомої особи надійшли гроші, гравець зобов’язаний негайно повідомити адміністрацію та повернути суму.", "punishment": "Permanent block", "notes": "Свідоме використання коштів незаконного походження також тягне перманентний блок.", "examples": ""}, {"section": "Економіка та майно", "id": "6.5", "text": "Оренда особистого майна/предметів за ціною, що не відповідає реальній ринковій вартості в ігровій економіці.", "punishment": "Ban 30 days", "notes": "", "examples": ""}, {"section": "Економіка та майно", "id": "6.6", "text": "Будь-який обман під час угод — приховування характеристик майна, введення в оману щодо вартості/стану, використання неуважності.", "punishment": "Ban up to 60 days / Permanent block", "notes": "Обман = навмисне викривлення інформації, що впливає на рішення про укладення угоди.", "examples": ""}, {"section": "Економіка та майно", "id": "6.7", "text": "Спам пропозиціями купівлі/продажу; більше двох послідовних повідомлень одному гравцю є порушенням.", "punishment": "Ban up to 60 days if deception resulted", "notes": "", "examples": ""}, {"section": "Економіка та майно", "id": "6.8", "text": "Гравець, який обманув іншого, може отримати пом’якшене покарання, якщо повністю повернув майно/гроші, а потерпілий надав письмову згоду.", "punishment": "", "notes": "Пункт не встановлює окремого стандартного покарання.", "examples": ""}, {"section": "Економіка та майно", "id": "6.9", "text": "Використання функціоналу бізнесу як тиску/шантажу/особистої вигоди поза офіційною механікою.", "punishment": "Warn / Ban 30 days / Business confiscation", "notes": "", "examples": ""}, {"section": "Економіка та майно", "id": "6.10", "text": "Фінансові піраміди, несанкціоновані лотереї, приватні банківські/страхові послуги без дозволу головного адміністратора.", "punishment": "Permanent block", "notes": "", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.1", "text": "Report — офіційний внутрішньоігровий канал між гравцем і адміністратором для повідомлень про порушення, технічних проблем та допомоги, яку неможливо отримати самостійно.", "punishment": "", "notes": "", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.2", "text": "Report має бути чітким і конкретним: суть проблеми, ID/нікнейм, за можливості місце.", "punishment": "", "notes": "Порожні report, незрозумілі запити та «?» не є підставою для дії; адміністратор може попросити уточнення.", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.3", "text": "Заборонено використовувати report для офтопу, жартів, флуду, звичайного спілкування та повідомлень без запиту адміністратора.", "punishment": "Report mute 20–60 min", "notes": "", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.4", "text": "Не можна просити адміністратора в report/грі зняти або пом’якшити покарання.", "punishment": "", "notes": "Несправедливе покарання можна оскаржити в офіційному розділі Discord протягом 72 годин.", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.5", "text": "Надання адміністрації неправдивої інформації, фальшивих доказів або приховування обставин.", "punishment": "Ban 7–30 days / Permanent block", "notes": "", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.6", "text": "Адміністратор може запросити додаткові контакти, наприклад Telegram, для складних/неоднозначних ситуацій; гравець може відмовитися, але це може вплинути на повноту розгляду.", "punishment": "", "notes": "", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.7", "text": "Скарги гравців та апеляції покарань подаються лише через офіційний розділ Discord; особисті повідомлення, гра та сторонні ресурси не розглядаються.", "punishment": "", "notes": "", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.8", "text": "Адміністратор може видати покарання протягом 72 годин із моменту фіксації порушення або подання скарги; пізні звернення можуть не розглядатися.", "punishment": "", "notes": "", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.9", "text": "Адміністратор зобов’язаний надати докази на запит гравця лише в межах відповідної офіційної скарги в Discord. Докази не надсилаються в особистих повідомленнях, грі чи на сторонніх ресурсах.", "punishment": "", "notes": "Надаються лише фото/відео з гри; логи, панелі виявлення та анонімні достовірні докази від гравців не надаються.", "examples": ""}, {"section": "Взаємодія з адміністрацією", "id": "7.10", "text": "Рішення адміністратора можна оскаржити лише через офіційну апеляцію. Публічне обговорення/критика/тиск у чатах не є способом апеляції та спричиняє окреме покарання.", "punishment": "", "notes": "", "examples": ""}, {"section": "Захист новачків", "id": "8.1", "text": "Новачок = гравець до 6 рівня включно.", "punishment": "", "notes": "", "examples": ""}, {"section": "Захист новачків", "id": "8.2", "text": "Пільговий режим діє лише для ненавмисних RP-порушень, спричинених об’єктивним незнанням: NonRP Drive, MG та інших легких RP-порушень (PG, незначний NonRP), за умови першого порушення та відсутності наміру отримати перевагу.", "punishment": "", "notes": "", "examples": ""}, {"section": "Захист новачків", "id": "8.3", "text": "Замість стандартного Jail/Warn/Ban адміністратор повинен застосувати навчальну процедуру попередження.", "punishment": "", "notes": "", "examples": ""}, {"section": "Захист новачків", "id": "8.3.1", "text": "Надіслати PM-попередження з коротким поясненням порушеного правила або телепортувати гравця для короткої усної розмови.", "punishment": "", "notes": "Пункт є частиною навчальної процедури за 8.3.", "examples": ""}, {"section": "Захист новачків", "id": "8.3.2", "text": "За потреби тимчасово заморозити гравця для подальшого пояснення/запобігання повторенню.", "punishment": "", "notes": "Пункт є частиною навчальної процедури за 8.3.", "examples": ""}, {"section": "Захист новачків", "id": "8.4", "text": "Пільговий режим НЕ застосовується до читів/стороннього ПЗ, Mass DM, Mass TK, Mass SK, інших масових порушень, образ родичів, дискримінації, погроз, будь-якого грошового шахрайства/багоюзу, скамів/обману.", "punishment": "", "notes": "", "examples": ""}, {"section": "Захист новачків", "id": "8.5", "text": "Перед покаранням адміністратор зобов’язаний перевірити рівень гравця через відповідну функцію.", "punishment": "", "notes": "", "examples": ""}];
const SECTIONS = ["Усі правила", "Загальні положення", "Обліковий запис та нікнейм", "Загальні правила поведінки на сервері", "Правила спілкування та чатів", "Правила Role Play поведінки", "Економіка та майно", "Взаємодія з адміністрацією", "Захист новачків"];
const aliases = {
  "dm":["death match","вбив","убив","стріляв","шкоди"],
  "mass dm":["масов","3+","троє"],
  "mg":["metagaming","метагейм","адмін","discord","пінг","краш","залаг"],
  "nonrp":["нерп","nonrp","нелогіч","реальн","логік"],
  "pg":["powergaming","надлюд","самозбереж"],
  "afk":["афк","afk","відійшов"],
  "ramming":["таран","підріз","зіткнен"],
  "bug":["баг","bug","помилка"],
  "майно":["будинок","квартира","бізнес","нерухом"],
  "гроші":["кошти","валюта","переказ","гроші","продаж"],
  "образ":["образ","приниж","батьк","родич"],
  "реклама":["реклам","сервер","сайт","канал"],
  "новач":["новач","рівень","level","6 рів"],
  "report":["report","репорт","адмін"],
  "скарга":["скарг","апеляц","discord"],
  "капс":["capslock","капслок","верхній регістр"],
  "флуд":["флуд","повторюван","повідомл"]
};
let activeSection="Усі правила", punishmentOnly=false;

const tabs=document.getElementById('tabs');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab'+(s===activeSection?' active':'');b.textContent=s;b.onclick=()=>{activeSection=s;[...tabs.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};tabs.appendChild(b)});

function norm(s){return s.toLowerCase().replaceAll('’',"'").replace(/[^a-zа-яіїєґ0-9.+-]/gi,' ')}
function searchable(r){return norm([r.id,r.text,r.punishment,r.notes,r.examples,r.section].join(' '))}
function render(){
  const q=norm(document.getElementById('search').value);
  const arr=RULES.filter(r=>(activeSection==="Усі правила"||r.section===activeSection)&&(!punishmentOnly||r.punishment));
  const out=q?arr.filter(r=>searchable(r).includes(q)||q.split(/\s+/).filter(Boolean).every(w=>searchable(r).includes(w))):arr;
  document.getElementById('count').textContent=out.length;
  const list=document.getElementById('list');
  list.innerHTML='';
  if(!out.length){list.innerHTML='<div class="empty">Нічого не знайдено.<br>Спробуй номер правила або інше ключове слово.</div>';return}
  out.forEach(r=>{
    const el=document.createElement('article');el.className='rule';
    el.innerHTML=`<div class="rid">${r.id}</div><div class="rtitle">${escapeHtml(r.text.slice(0,120))}${r.text.length>120?'…':''}</div>${r.punishment?`<span class="pun">⚠ ${escapeHtml(r.punishment)}</span>`:''}`;
    el.onclick=()=>openRule(r);list.appendChild(el);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openRule(r){
  let h=`<div class="section">${escapeHtml(r.section)}</div><h2>${escapeHtml(r.id)}</h2><div class="block"><div class="label">Правило</div><div class="value">${escapeHtml(r.text)}</div></div>`;
  if(r.punishment)h+=`<div class="block"><div class="label">Покарання</div><div class="value punbig">${escapeHtml(r.punishment)}</div></div>`;
  if(r.notes)h+=`<div class="block"><div class="label">Примітка / виняток</div><div class="note">${escapeHtml(r.notes)}</div></div>`;
  if(r.examples)h+=`<div class="block"><div class="label">Приклад</div><div class="value">${escapeHtml(r.examples)}</div></div>`;
  h+=`<div class="tools" style="margin-top:20px"><button class="btn" onclick="copyRule('${r.id}')">📋 Скопіювати</button></div>`;
  document.getElementById('detail').innerHTML=h;document.getElementById('overlay').classList.add('show');
}
function copyRule(id){const r=RULES.find(x=>x.id===id);const t=`${r.id} — ${r.text}${r.punishment?`\nПокарання: ${r.punishment}`:''}${r.notes?`\nПримітка: ${r.notes}`:''}${r.examples?`\nПриклад: ${r.examples}`:''}`;navigator.clipboard?.writeText(t)}
document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.currentTarget.classList.remove('show')};
document.getElementById('search').oninput=render;
document.getElementById('punBtn').onclick=()=>{punishmentOnly=!punishmentOnly;document.getElementById('punBtn').classList.toggle('active',punishmentOnly);document.getElementById('allBtn').classList.toggle('active',!punishmentOnly);render()};
document.getElementById('allBtn').onclick=()=>{punishmentOnly=false;document.getElementById('punBtn').classList.remove('active');document.getElementById('allBtn').classList.add('active');render()};
document.getElementById('analysisBtn').onclick=()=>{document.getElementById('list').style.display='none';document.getElementById('analysis').classList.add('show');document.getElementById('analysisBtn').classList.add('active')};
document.getElementById('analyze').onclick=()=>{
  const q=norm(document.getElementById('situation').value);
  if(!q){document.getElementById('result').innerHTML='<div class="empty">Опиши ситуацію.</div>';return}
  const terms=q.split(/\s+/).filter(Boolean);
  const scored=RULES.map(r=>{let s=0,t=searchable(r);terms.forEach(x=>{if(x.length>2&&t.includes(x))s+=2});Object.values(aliases).forEach(a=>{if(a.some(x=>q.includes(norm(x)))){if(a.some(x=>t.includes(norm(x))))s+=3}});return [s,r]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,8);
  document.getElementById('result').innerHTML=scored.length?scored.map(x=>`<article class="rule" onclick='openRule(${JSON.stringify(x[1])})'><div class="rid">${escapeHtml(x[1].id)}</div><div class="rtitle">${escapeHtml(x[1].text.slice(0,150))}${x[1].text.length>150?'…':''}</div>${x[1].punishment?`<span class="pun">⚠ ${escapeHtml(x[1].punishment)}</span>`:''}</article>`).join(''):'<div class="empty">Не знайшов достатньо схожих правил.</div>';
};
document.getElementById('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
render();
</script>
</body>
</html>
